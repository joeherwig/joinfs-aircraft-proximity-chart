<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aircraft proximity</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1c2330; }
    /* wide screens: the chart fills the window and its side panel scrolls; small screens: the page scrolls */
    @media (min-width: 801px) {
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; overflow: hidden; }
      joinfs-proximity-chart { flex: 1 1 0; min-height: 0; }
    }
    @media (prefers-color-scheme: dark) { html:not([data-theme=light]) body { background: #14181f; color: #e6e9ef; } }
    html[data-theme=dark] body { background: #14181f; color: #e6e9ef; }
    html[data-theme=light] body { background: #fff; color: #1c2330; }
    :root { color-scheme: light dark; }
    html[data-theme=light] { color-scheme: light; }
    html[data-theme=dark] { color-scheme: dark; }
    header { padding: 8px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; }
    joinfs-proximity-chart { --joinfs-proximity-height: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Aircraft proximity</h1>
    <span id="selected"></span>
  </header>
  <joinfs-proximity-chart id="chart"></joinfs-proximity-chart>
  <script src="joinfs-proximity-chart.js"></script>
  <script>
    // URL parameters map onto the component's attributes; every piece of optional page chrome is guarded.
    // ?lang=de&search=cardinal&color-by=manufacturer&engine-type=piston&engines=1&wing=high&gear=tricycle
    // &manufacturer=Cessna&k=6&min-proximity=40&focus=C177
    const chart = document.getElementById('chart');
    const params = new URLSearchParams(location.search);
    const PARAMS = ['lang', 'search', 'color-by', 'engine-type', 'engines', 'wing', 'gear', 'manufacturer', 'callsign', 'theme', 'k', 'min-proximity', 'show-uninstalled', 'focus'];
    if (chart) for (const name of PARAMS) if (params.get(name)) chart.setAttribute(name, params.get(name));
    // q, s and icao are aliases of search: ?icao=C177 (what JoinFS passes) is the same as typing C177 into the
    // search box and confirming it. search wins over q, q over s, s over icao.
    if (chart && !params.get('search')) {
      const alias = ['q', 's', 'icao'].map(n => params.get(n)).find(Boolean);
      if (alias) chart.setAttribute('search', alias);
    }
    // Keep the address bar in step with the form, so the current view can be shared or bookmarked.
    if (chart) chart.addEventListener('joinfs-proximity-change', e => {
      const next = new URLSearchParams();
      for (const keep of ['lang', 'theme']) if (params.get(keep)) next.set(keep, params.get(keep));
      for (const [name, value] of Object.entries(e.detail)) next.set(name, value);
      history.replaceState(null, '', next.toString() ? `?${next}` : location.pathname);
    });
    // Language and theme are auto-detected (browser languages, system light/dark). ?lang= and ?theme=light|dark only override them.
    const theme = params.get('theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    const selected = document.getElementById('selected');
    if (selected && chart) {
      chart.addEventListener('joinfs-proximity-select', e => { selected.textContent = `${e.detail.icao}: ${e.detail.neighbours.join(' ')}`; });
    }
  </script>
</body>
</html>
